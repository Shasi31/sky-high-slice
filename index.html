<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain-Reaction Pop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            user-select: none;
        }
        canvas {
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            cursor: pointer;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        #level-indicator {
            font-size: 13px;
            color: #fbbf24;
            letter-spacing: 1px;
            margin-top: 3px;
        }
        p {
            margin: 6px 0 0;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="score-display">SCORE: 0</h1>
        <div id="level-indicator">LEVEL 1</div>
        <p id="instruction">Tap anywhere to trigger a chain reaction</p>
    </div>

    <canvas id="gameCanvas" width="380" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");
        const levelIndicator = document.getElementById("level-indicator");
        const instruction = document.getElementById("instruction");

        let score = 0;
        let level = 1;
        let gameState = "READY"; // READY, PLAYING, GAME_OVER
        
        let orbs = [];
        let ripples = [];
        let particles = [];
        let tapsLeft = 1;

        class Orb {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 12;
                this.color = color;
                this.isExploding = false;
                this.explodingTimer = 0;
            }
            update() {
                if (this.isExploding) {
                    this.explodingTimer++;
                    this.radius += 0.8;
                    return;
                }
                // Move floating orbs around smoothly
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off canvas walls
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.vx *= -1;
                if (this.y - this.radius < 50 || this.y + this.radius > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = this.isExploding ? 20 : 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Ripple {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 70 + (level * 10);
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.radius += 3.5;
                this.alpha = 1 - (this.radius / this.maxRadius);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.alpha = 1;
                this.radius = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function startLevel() {
            orbs = [];
            ripples = [];
            particles = [];
            tapsLeft = 1;
            gameState = "READY";
            instruction.innerText = "Tap anywhere to launch trigger";

            let orbCount = 5 + (level * 3); // More orbs each level
            let colors = ["#38bdf8", "#fbbf24", "#f43f5e", "#a855f7", "#34d399"];

            for (let i = 0; i < orbCount; i++) {
                let x = Math.random() * (canvas.width - 60) + 30;
                let y = Math.random() * (canvas.height - 120) + 70;
                let vx = (Math.random() - 0.5) * (1.5 + level * 0.2);
                let vy = (Math.random() - 0.5) * (1.5 + level * 0.2);
                let color = colors[i % colors.length];
                orbs.push(new Orb(x, y, vx, vy, color));
            }
            levelIndicator.innerText = "LEVEL " + level;
        }

        canvas.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            if (gameState === "READY" && tapsLeft > 0) {
                tapsLeft--;
                gameState = "PLAYING";
                instruction.innerText = "Chain reaction in progress...";
                ripples.push(new Ripple(clickX, clickY, "#38bdf8"));
            } else if (gameState === "GAME_OVER") {
                level = 1;
                score = 0;
                scoreDisplay.innerText = "SCORE: " + score;
                startLevel();
            }
        });

        function update() {
            // Update orbs
            orbs.forEach(orb => orb.update());

            // Update ripples & check collisions with orbs
            ripples.forEach((ripple, rIndex) => {
                ripple.update();

                orbs.forEach(orb => {
                    if (!orb.isExploding) {
                        let dist = Math.hypot(ripple.x - orb.x, ripple.y - orb.y);
                        // If ripple touches an orb, trigger secondary explosion ripple!
                        if (dist < ripple.radius + orb.radius) {
                            orb.isExploding = true;
                            score += 100;
                            scoreDisplay.innerText = "SCORE: " + score;

                            // Spawn explosion particles
                            for (let p = 0; p < 8; p++) {
                                particles.push(new Particle(orb.x, orb.y, orb.color));
                            }
                            // Trigger secondary expanding ripple wave from this popped orb
                            ripples.push(new Ripple(orb.x, orb.y, orb.color));
                        }
                    }
                });

                if (ripple.alpha <= 0) {
                    ripples.splice(rIndex, 1);
                }
            });

            // Update particles
            particles.forEach((p, index) => {
                p.update();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // Remove fully exploded orbs
            orbs = orbs.filter(orb => !orb.isExploding || orb.explodingTimer < 25);

            // Check win/loss conditions when playing
            if (gameState === "PLAYING" && ripples.length === 0) {
                let poppedCount = orbs.filter(o => o.isExploding).length;
                // Win if you clear a target percentage (e.g., 50% or more of the board)
                let totalOrbs = orbs.length + poppedCount;
                let successRate = poppedCount / totalOrbs;

                if (poppedCount >= 3 || (totalOrbs <= 5 && poppedCount > 0)) {
                    // Level Cleared! Advance next level after brief delay
                    setTimeout(() => {
                        level++;
                        startLevel();
                    }, 1000);
                    gameState = "LEVEL_CLEAR";
                } else if (tapsLeft === 0) {
                    // Failed to pop enough
                    gameState = "GAME_OVER";
                    instruction.innerText = "Tap to Try Again";
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw game elements
            orbs.forEach(orb => orb.draw());
            ripples.forEach(ripple => ripple.draw());
            particles.forEach(p => p.draw());

            // Game Over / Win overlays
            if (gameState === "GAME_OVER") {
                ctx.fillStyle = "rgba(9, 13, 22, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f43f5e";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#f43f5e";
                ctx.fillText("CHAIN STOPPED", canvas.width / 2, canvas.height / 2 - 20);

                ctx.shadowBlur = 0;
                ctx.fillStyle = "#fbbf24";
                ctx.font = "16px sans-serif";
                ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 15);
            } else if (gameState === "LEVEL_CLEAR") {
                ctx.fillStyle = "rgba(9, 13, 22, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#34d399";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#34d399";
                ctx.fillText("LEVEL CLEARED!", canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        startLevel();
        loop();
    </script>
</body>
</html>
