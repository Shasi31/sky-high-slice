<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Pop - Satisfying Tap Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            user-select: none;
        }
        canvas {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            cursor: pointer;
        }
        #ui {
            position: absolute;
            top: 25px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="score-display">0</h1>
        <p>Tap bubbles to pop them!</p>
    </div>

    <canvas id="gameCanvas" width="380" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");

        let score = 0;
        let bubbles = [];
        let particles = [];

        class Bubble {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 20 + 25; // Nice big targets, easy to tap!
                this.color = `hsl(${Math.random() * 360}, 85%, 60%)`;
                this.vy = -(Math.random() * 1.5 + 1); // Float slowly upward
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.y += this.vy;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.8; // Gentle floating side-to-side

                // Reset to bottom if it floats off-screen
                if (this.y + this.radius < 0) {
                    this.y = canvas.height + this.radius;
                    this.x = Math.random() * (canvas.width - 60) + 30;
                }
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                // Bubble body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Glossy reflection highlight (makes it look 3D and premium)
                ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.alpha = 1;
                this.radius = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spawn initial bubbles
        for (let i = 0; i < 8; i++) {
            bubbles.push(new Bubble(Math.random() * (canvas.width - 60) + 30, Math.random() * canvas.height));
        }

        // Tap or Click handling - ANY tap near a bubble pops it instantly!
        canvas.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            bubbles.forEach((bubble, index) => {
                let dist = Math.hypot(clickX - bubble.x, clickY - bubble.y);
                // Generous hit box (dist < bubble.radius + 15) so it's impossible to miss
                if (dist < bubble.radius + 15) {
                    score++;
                    scoreDisplay.innerText = score;

                    // Create burst particles
                    for (let p = 0; p < 10; p++) {
                        particles.push(new Particle(bubble.x, bubble.y, bubble.color));
                    }

                    // Respawn bubble at the bottom instantly
                    bubble.y = canvas.height + bubble.radius;
                    bubble.x = Math.random() * (canvas.width - 60) + 30;
                    bubble.radius = Math.random() * 20 + 25;
                    bubble.color = `hsl(${Math.random() * 360}, 85%, 60%)`;
                }
            });
        });

        function update() {
            bubbles.forEach(bubble => bubble.update());
            particles.forEach((p, index) => {
                p.update();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bubbles.forEach(bubble => bubble.draw());
            particles.forEach(p => p.draw());
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
